<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard – VoltCore</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0A0A0A;
      color: #F5F0E8;
      font-family: 'Space Mono', monospace;
      padding: 40px;
    }
    h1 { color: #00FF87; font-size: 32px; margin-bottom: 8px; }
    .subtitle { color: #888; margin-bottom: 40px; }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }
    .nav-links { display: flex; gap: 16px; }
    .nav-links a, .nav-links button {
      color: #AAA;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      text-decoration: none;
    }
    .nav-links a:hover, .nav-links button:hover { color: #00FF87; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: #1A1A1A;
      border: 1px solid #333;
      padding: 24px;
      border-radius: 8px;
    }
    .stat-label {
      color: #888;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .stat-value { color: #00FF87; font-size: 28px; font-weight: bold; }
    .section { margin-bottom: 40px; }
    .section h2 { color: #F5F0E8; font-size: 20px; margin-bottom: 16px; }
    table {
      width: 100%;
      background: #1A1A1A;
      border-radius: 8px;
      overflow: hidden;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      font-size: 12px;
      border-bottom: 1px solid #252525;
    }
    th {
      background: #111;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 10px;
    }
    tr:hover td { background: #111; }
    .status {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      text-transform: uppercase;
    }
    .status.completed { background: #0D1F15; color: #00FF87; }
    .status.running { background: #1A2E1A; color: #4AADFF; }
    .status.failed { background: #1A0E08; color: #FF5F1F; }
    .status.pending { background: #1A1A0A; color: #FFD700; }
    .status.provisioning { background: #1A1A0A; color: #FFD700; }
    .empty { text-align: center; padding: 40px; color: #666; }
    .topup-btn {
      background: #00FF87;
      color: #0A0A0A;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }
    .topup-btn:hover { background: #00CC6A; }
  </style>
</head>
<body>
  <div class="nav">
    <div><strong style="color: #00FF87; font-size: 20px;">⚡ VoltCore</strong></div>
    <div class="nav-links">
      <a href="/developers">API Docs</a>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <h1 id="welcome">Loading...</h1>
  <p class="subtitle" id="email"></p>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Wallet Balance</div>
      <div class="stat-value" id="balance">₦0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Jobs</div>
      <div class="stat-value" id="totalJobs">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Active Jobs</div>
      <div class="stat-value" id="activeJobs">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Referrals</div>
      <div class="stat-value" id="referrals">0</div>
    </div>
  </div>

  <div style="margin-bottom: 40px;">
    <button class="topup-btn" onclick="alert('Top-up via Telegram: /topup')">💳 Top Up Wallet</button>
  </div>

  <div class="section">
    <h2>Recent Jobs</h2>
    <table id="jobsTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>GPU</th>
          <th>Hours</th>
          <th>Cost</th>
          <th>Status</th>
          <th>Created</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    async function loadDashboard() {
      try {
        const me = await fetch('/api/auth/me').then(r => r.json())
        document.getElementById('welcome').textContent = `Welcome, ${me.user.firstName || me.user.email}`
        document.getElementById('email').textContent = me.user.email
        document.getElementById('balance').textContent = `₦${(me.wallet.balance || 0).toLocaleString()}`

        const jobs = await fetch('/api/user/jobs').then(r => r.json())
        document.getElementById('totalJobs').textContent = jobs.pagination.total
        document.getElementById('activeJobs').textContent =
          jobs.jobs.filter(j => ['pending', 'provisioning', 'running'].includes(j.status)).length

        const tbody = document.querySelector('#jobsTable tbody')
        if (jobs.jobs.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="empty">No jobs yet. Start one via Telegram /start</td></tr>`
        } else {
          tbody.innerHTML = jobs.jobs.map(j => `
            <tr>
              <td>${j.id.slice(0, 8)}</td>
              <td>${j.gpuType.toUpperCase()}</td>
              <td>${j.requestedHours}</td>
              <td>₦${j.totalCostNGN.toLocaleString()}</td>
              <td><span class="status ${j.status}">${j.status}</span></td>
              <td>${new Date(j.createdAt).toLocaleDateString()}</td>
              <td>
                ${['pending', 'provisioning', 'running'].includes(j.status)
                  ? `<button onclick="cancelJob('${j.id}')" style="background: #FF5F1F; color: #F5F0E8; padding: 4px 10px; border: none; border-radius: 4px; font-size: 10px; cursor: pointer;">Cancel</button>`
                  : '—'}
              </td>
            </tr>
          `).join('')
        }

        const refs = await fetch('/api/user/referrals').then(r => r.json())
        document.getElementById('referrals').textContent = refs.stats.total
      } catch (err) {
        console.error(err)
        window.location.href = '/login'
      }
    }

    async function cancelJob(jobId) {
      if (!confirm('Cancel this job?')) return
      try {
        const res = await fetch(`/api/user/jobs/${jobId}/cancel`, { method: 'POST' })
        const data = await res.json()
        if (data.success) {
          alert(`✅ Cancelled. Refunded ₦${data.refunded.toLocaleString()}`)
          loadDashboard()
        } else {
          alert(`❌ ${data.error}`)
        }
      } catch (err) {
        alert('Cancel failed')
      }
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' })
      window.location.href = '/'
    }

    loadDashboard()
  </script>
</body>
</html>
