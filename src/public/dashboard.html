<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard – VoltCore</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0A0A0A;
      color: #F5F0E8;
      font-family: 'Space Mono', monospace;
      padding: 40px;
    }
    h1 { color: #00FF87; font-size: 32px; margin-bottom: 8px; }
    .subtitle { color: #888; margin-bottom: 40px; }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }
    .nav-links { display: flex; gap: 20px;}
    .nav-links a, .nav-links button {
      color: #AAA;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      text-decoration: none;
    }
    .nav-links a:hover, .nav-links button:hover { color: #00FF87; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: #1A1A1A;
      border: 1px solid #333;
      padding: 24px;
      border-radius: 8px;
    }
    .stat-label {
      color: #888;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .stat-value { color: #00FF87; font-size: 28px; font-weight: bold; }
    .section { margin-bottom: 40px; }
    .section h2 { color: #F5F0E8; font-size: 20px; margin-bottom: 16px; }
    table {
      width: 100%;
      background: #1A1A1A;
      border-radius: 8px;
      overflow: hidden;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      font-size: 12px;
      border-bottom: 1px solid #252525;
    }
    th {
      background: #111;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 10px;
    }
    tr:hover td { background: #111; }
    .status {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      text-transform: uppercase;
    }
    .status.completed { background: #0D1F15; color: #00FF87; }
    .status.running { background: #1A2E1A; color: #4AADFF; }
    .status.failed { background: #1A0E08; color: #FF5F1F; }
    .status.pending { background: #1A1A0A; color: #FFD700; }
    .status.provisioning { background: #1A1A0A; color: #FFD700; }
    .empty { text-align: center; padding: 40px; color: #666; }
    .topup-btn {
      background: #00FF87;
      color: #0A0A0A;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }
    .topup-btn:hover { background: #00CC6A; }
  </style>
</head>
<body>
  <div class="nav">
    <div><strong style="color: #00FF87; font-size: 20px;">⚡ VoltCore</strong></div>
    <div class="nav-links">
      <a href="/developers">API Docs</a>
      <button onclick="toggleNotifications()" style="position: relative; background: none; border: none; color: #AAA; cursor: pointer; font-size: 18px;">
  🔔
  <span id="notifBadge" style="position: absolute; top: -6px; right: -8px; background: #FF5F1F; color: #FFF; border-radius: 10px; padding: 2px 6px; font-size: 10px; display: none;">0</span>
</button>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <h1 id="welcome">Loading...</h1>
  <p class="subtitle" id="email"></p>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Wallet Balance</div>
      <div class="stat-value" id="balance">₦0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Jobs</div>
      <div class="stat-value" id="totalJobs">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Active Jobs</div>
      <div class="stat-value" id="activeJobs">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Referrals</div>
      <div class="stat-value" id="referrals">0</div>
    </div>
  </div>

  <div style="margin-bottom: 40px;">
    <button class="topup-btn" onclick="alert('Top-up via Telegram: /topup')">💳 Top Up Wallet</button>
  </div>

  <div class="section">
  <h2>💼 Wallet & Transactions</h2>
  <div style="margin-bottom: 16px;">
    <button class="topup-btn" onclick="topupPrompt()">💳 Top Up</button>
  </div>
  <table id="transactionsTable">
    <thead>
      <tr>
        <th>Date</th>
        <th>Type</th>
        <th>Description</th>
        <th>Amount</th>
        <th>Balance</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>


  <div class="section">
    <h2>Recent Jobs</h2>
    <table id="jobsTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>GPU</th>
          <th>Hours</th>
          <th>Cost</th>
          <th>Status</th>
          <th>Created</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div id="notifDropdown" style="display: none; position: fixed; top: 80px; right: 40px; width: 380px; max-height: 500px; background: #1A1A1A; border: 1px solid #333; border-radius: 8px; overflow-y: auto; z-index: 1000; box-shadow: 0 8px 24px rgba(0,0,0,0.5);">
  <div style="padding: 16px; border-bottom: 1px solid #252525; display: flex; justify-content: space-between; align-items: center;">
    <strong style="color: #00FF87;">Notifications</strong>
    <button onclick="markAllRead()" style="background: none; border: none; color: #888; cursor: pointer; font-size: 12px;">Mark all read</button>
  </div>
  <div id="notifList"></div>
</div>

  <script>
    async function loadDashboard() {
      try {
        const me = await fetch('/api/auth/me').then(r => r.json())
        document.getElementById('welcome').textContent = `Welcome, ${me.user.firstName || me.user.email}`
        document.getElementById('email').textContent = me.user.email
        document.getElementById('balance').textContent = `₦${(me.wallet.balance || 0).toLocaleString()}`

        const jobs = await fetch('/api/user/jobs').then(r => r.json())
        document.getElementById('totalJobs').textContent = jobs.pagination.total
        document.getElementById('activeJobs').textContent =
          jobs.jobs.filter(j => ['pending', 'provisioning', 'running'].includes(j.status)).length

        const tbody = document.querySelector('#jobsTable tbody')
        if (jobs.jobs.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="empty">No jobs yet. Start one via Telegram /start</td></tr>`
        } else {
          tbody.innerHTML = jobs.jobs.map(j => `
            <tr>
              <td>${j.id.slice(0, 8)}</td>
              <td>${j.gpuType.toUpperCase()}</td>
              <td>${j.requestedHours}</td>
              <td>₦${j.totalCostNGN.toLocaleString()}</td>
              <td><span class="status ${j.status}">${j.status}</span></td>
              <td>${new Date(j.createdAt).toLocaleDateString()}</td>
              <td>
                ${['pending', 'provisioning', 'running'].includes(j.status)
                  ? `<button onclick="cancelJob('${j.id}')" style="background: #FF5F1F; color: #F5F0E8; padding: 4px 10px; border: none; border-radius: 4px; font-size: 10px; cursor: pointer;">Cancel</button>`
                  : '—'}
              </td>
            </tr>
          `).join('')
        }

        const refs = await fetch('/api/user/referrals').then(r => r.json())
        document.getElementById('referrals').textContent = refs.stats.total
      } catch (err) {
        console.error(err)
        window.location.href = '/login'
      }
    }

    async function registerPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return

  try {
    const reg = await navigator.serviceWorker.register('/service-worker.js')
    const vapidRes = await fetch('/api/notifications/push/vapid-key').then(r => r.json())
    if (!vapidRes.publicKey) return

    const permission = await Notification.requestPermission()
    if (permission !== 'granted') return

    const subscription = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: vapidRes.publicKey
    })

    await fetch('/api/notifications/push/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subscription: subscription.toJSON() })
    })
    console.log('✅ Push notifications enabled')
  } catch (err) {
    console.warn('Push setup failed:', err.message)
  }
}

registerPush()

    async function loadNotifications() {
  try {
    const data = await fetch('/api/notifications').then(r => r.json())
    const badge = document.getElementById('notifBadge')
    if (data.unread > 0) {
      badge.textContent = data.unread
      badge.style.display = 'block'
    } else {
      badge.style.display = 'none'
    }

    const list = document.getElementById('notifList')
    if (data.notifications.length === 0) {
      list.innerHTML = '<div style="padding: 40px; text-align: center; color: #666;">No notifications</div>'
    } else {
      list.innerHTML = data.notifications.map(n => `
        <div style="padding: 16px; border-bottom: 1px solid #252525; ${n.read ? 'opacity: 0.6;' : ''}">
          <div style="font-weight: bold; color: #F5F0E8; margin-bottom: 4px;">${n.title}</div>
          <div style="font-size: 12px; color: #AAA;">${n.body}</div>
          <div style="font-size: 10px; color: #666; margin-top: 8px;">${new Date(n.createdAt).toLocaleString()}</div>
        </div>
      `).join('')
    }
  } catch (err) {
    console.error('Notifications load failed:', err)
  }
}


async function loadTransactions() {
  try {
    const data = await fetch('/api/wallet/transactions').then(r => r.json())
    const tbody = document.querySelector('#transactionsTable tbody')

    if (!data.transactions || data.transactions.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #666;">No transactions yet</td></tr>`
      return
    }

    tbody.innerHTML = data.transactions.map(t => `
      <tr>
        <td>${new Date(t.createdAt).toLocaleString()}</td>
        <td>${t.type}</td>
        <td>${t.description || '—'}</td>
        <td style="color: ${t.amountNGN >= 0 ? '#00FF87' : '#FF5F1F'}">
          ${t.amountNGN >= 0 ? '+' : ''}₦${Math.abs(t.amountNGN).toLocaleString()}
        </td>
        <td>₦${t.balanceAfter.toLocaleString()}</td>
      </tr>
    `).join('')
  } catch (err) {
    console.error(err)
  }
}

async function topupPrompt() {
  const amount = prompt('Amount to top up (₦, minimum 1,000):', '5000')
  if (!amount) return

  try {
    const res = await fetch('/api/wallet/topup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount: parseInt(amount) })
    })
    const data = await res.json()
    if (data.success) {
      window.location.href = data.authorizationUrl
    } else {
      alert(data.error)
    }
  } catch (err) {
    alert('Topup failed')
  }
}

// Call in loadDashboard
loadTransactions()



function toggleNotifications() {
  const dd = document.getElementById('notifDropdown')
  dd.style.display = dd.style.display === 'none' ? 'block' : 'none'
}

async function markAllRead() {
  await fetch('/api/notifications/read-all', { method: 'POST' })
  loadNotifications()
}

// Close dropdown on outside click
document.addEventListener('click', (e) => {
  const dd = document.getElementById('notifDropdown')
  if (dd && !dd.contains(e.target) && !e.target.closest('button')) {
    dd.style.display = 'none'
  }
})

// Refresh notifications every 30s
setInterval(loadNotifications, 30000)
loadNotifications()

    async function cancelJob(jobId) {
      if (!confirm('Cancel this job?')) return
      try {
        const res = await fetch(`/api/user/jobs/${jobId}/cancel`, { method: 'POST' })
        const data = await res.json()
        if (data.success) {
          alert(`✅ Cancelled. Refunded ₦${data.refunded.toLocaleString()}`)
          loadDashboard()
        } else {
          alert(`❌ ${data.error}`)
        }
      } catch (err) {
        alert('Cancel failed')
      }
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' })
      window.location.href = '/'
    }

    loadDashboard()
  </script>
</body>
</html>
