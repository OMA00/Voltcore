<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ambassador Dashboard – VoltCore</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0A0A0A;
      color: #F5F0E8;
      font-family: 'Space Mono', monospace;
      padding: 40px;
    }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }
    .logo { color: #00FF87; font-size: 20px; font-weight: bold; }
    .nav-links a { color: #AAA; text-decoration: none; font-size: 14px; margin-left: 20px; }
    .nav-links a:hover { color: #00FF87; }
    h1 { color: #00FF87; font-size: 36px; margin-bottom: 8px; }
    .subtitle { color: #888; margin-bottom: 40px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: #1A1A1A;
      border: 1px solid #333;
      padding: 24px;
      border-radius: 8px;
    }
    .stat-label { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .stat-value { color: #00FF87; font-size: 32px; font-weight: bold; }
    .tier-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-left: 12px;
    }
    .tier-bronze { background: #4A2E1A; color: #FFA500; }
    .tier-silver { background: #2A2A2A; color: #C0C0C0; }
    .tier-gold { background: #2E2A0D; color: #FFD700; }
    .section { margin-bottom: 40px; }
    .section h2 { color: #F5F0E8; font-size: 20px; margin-bottom: 16px; }
    .referral-box {
      background: #1A1A1A;
      border: 2px solid #00FF87;
      padding: 24px;
      border-radius: 8px;
      margin-bottom: 24px;
    }
    .referral-code {
      color: #00FF87;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 4px;
      text-align: center;
      padding: 20px;
      background: #0A0A0A;
      border-radius: 4px;
    }
    table {
      width: 100%;
      background: #1A1A1A;
      border-radius: 8px;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      font-size: 12px;
      border-bottom: 1px solid #252525;
    }
    th {
      background: #111;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 10px;
    }
    .progress-bar {
      height: 8px;
      background: #222;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      background: #00FF87;
    }
    .btn {
      background: #00FF87;
      color: #0A0A0A;
      border: none;
      padding: 12px 24px;
      font-family: inherit;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover { background: #00CC6A; }
    .empty { text-align: center; padding: 60px; color: #666; }
  </style>
</head>
<body>
  <div class="nav">
    <div class="logo">⚡ VoltCore</div>
    <div class="nav-links">
      <a href="/dashboard">Dashboard</a>
      <a href="/school">AI School</a>
      <a href="/leaderboard">Leaderboard</a>
    </div>
  </div>

  <h1 id="welcome">Ambassador Dashboard</h1>
  <p class="subtitle" id="subtitle">Loading...</p>

  <div id="notAmbassador" style="display: none;" class="empty">
    <p style="font-size: 18px; margin-bottom: 24px;">You're not an ambassador yet.</p>
    <button class="btn" onclick="registerAmbassador()">Become an Ambassador</button>
  </div>

  <div id="ambassadorContent" style="display: none;">
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Total Referrals</div>
        <div class="stat-value" id="totalReferrals">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Earned</div>
        <div class="stat-value" id="totalEarned">₦0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Tier</div>
        <div class="stat-value" id="tier">Bronze</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Next Tier</div>
        <div class="stat-value" id="nextTier">—</div>
        <div class="progress-bar">
          <div class="progress-fill" id="tierProgress" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <div class="referral-box">
      <p style="color: #888; font-size: 12px; text-transform: uppercase; margin-bottom: 12px;">Your Referral Code</p>
      <div class="referral-code" id="referralCode">—</div>
      <p style="color: #888; font-size: 12px; margin-top: 12px; text-align: center;">Share this code with friends and university communities</p>
    </div>

    <div class="section">
      <h2>Recent Activity</h2>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Description</th>
            <th>Reward</th>
          </tr>
        </thead>
        <tbody id="eventsTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    async function load() {
      try {
        const res = await fetch('/api/growth/ambassador/me')
        if (res.status === 404) {
          document.getElementById('notAmbassador').style.display = 'block'
          document.getElementById('subtitle').textContent = ''
          return
        }
        const data = await res.json()
        if (!res.ok) throw new Error(data.error)

        document.getElementById('subtitle').textContent = `Welcome back! Code: ${data.referralCode}`
        document.getElementById('ambassadorContent').style.display = 'block'
        document.getElementById('totalReferrals').textContent = data.totalReferrals
        document.getElementById('totalEarned').textContent = `₦${data.totalEarnedNGN.toLocaleString()}`
        document.getElementById('tier').innerHTML = `${data.tier} <span class="tier-badge tier-${data.tier}">${data.tier}</span>`
        document.getElementById('referralCode').textContent = data.referralCode

        if (data.nextTier) {
          const required = data.nextTierRequirement
          const progress = Math.max(0, 100 - (required / 30) * 100)
          document.getElementById('nextTier').textContent = `${data.nextTier} (${required} more)`
          document.getElementById('tierProgress').style.width = `${progress}%`
        }

        const tbody = document.getElementById('eventsTable')
        if (data.recentEvents.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="empty">No events yet.</td></tr>`
        } else {
          tbody.innerHTML = data.recentEvents.map(e => `
            <tr>
              <td>${new Date(e.createdAt).toLocaleDateString()}</td>
              <td>${e.eventType}</td>
              <td>${e.description || '—'}</td>
              <td>₦${e.rewardNGN.toLocaleString()}</td>
            </tr>
          `).join('')
        }
      } catch (err) {
        console.error(err)
        window.location.href = '/login'
      }
    }

    async function registerAmbassador() {
      const university = prompt('Your university (optional):')
      const city = prompt('Your city (optional):')
      try {
        const res = await fetch('/api/growth/ambassador/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ university, city })
        })
        const data = await res.json()
        if (!res.ok) throw new Error(data.error)
        alert(`✅ You are now a VoltCore Ambassador! Code: ${data.ambassador.referralCode}`)
        load()
      } catch (err) {
        alert(`Error: ${err.message}`)
      }
    }

    load()
  </script>
</body>
</html>
